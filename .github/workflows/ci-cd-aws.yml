name: CI CD AWS

# Event Triggers:
# The pipeline is triggered whenever there is a push to the main branch.
# It is also triggered whenever there is a pull request to the main branch

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  AWS_REGION: eu-west-3                 # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: saal/mlops_projet           # set this to your Amazon ECR repository name
  ECS_SERVICE: mlops_projet-service                 # set this to your Amazon ECS service name
  ECS_CLUSTER: mlops-projet                 # set this to your Amazon ECS cluster name
  ECS_TASK_DEFINITION: mlops_projet # set this to the path to your Amazon ECS task definition
                                               # file, e.g .aws/task-definition.json
  CONTAINER_NAME: mlops_projet           # set this to the name of the container in the
                                               # containerDefinitions section of your task definition
                     # containerDefinitions section of your task definition

permissions:
  contents: read

# this pipeline consists of a two jobs named ci_pipeline

jobs:

  ci_pipeline: 
       runs-on: ubuntu-latest     # The job runs on the ubuntu-latest operating system
       
       steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
#The first step uses the actions/checkout@v1 action to clone the repository.
#The fetch-depth: 0 parameter ensures that the complete commit history is fetched.

        - name: Set up Python 3.11
          uses: actions/setup-python@v4
          with:
            python-version: '3.11'
#The second step sets up Python 3.11 by using the actions/setup-python@v4 action.
#The python-version: 3.11 parameter specifies the desired Python version.

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
# The third step installs the project dependencies.

        - name: Format
          run: |
            black app/app.py
# The fourth step formats the app.py file using the black code formatter.

        - name: Lint
          run: |
            pylint --disable=R,C app/app.py
#The fifth step performs linting on the app.py file using pylint.
#The --disable=R,C flag disables specific pylint checks.

        - name: Test
          run: |
            python -m pytest -vv app/test.py

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci_pipeline]
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and
        # push it to ECR so that it can
        # be deployed to ECS.
        
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        
    - name: Download task definition
      run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --query "taskDefinition | {containerDefinitions: containerDefinitions, family: family, executionRoleArn: executionRoleArn, taskRoleArn: taskRoleArn, networkMode: networkMode, requiresCompatibilities: requiresCompatibilities, cpu: cpu, memory: memory}" \
          > task-definition.json

          
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
